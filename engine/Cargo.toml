[package]
name = "nudge-engine"
version = "0.1.0"
edition = "2021"
# Cargo.lock uses lockfile format v4, which Cargo reads from 1.78 on. The code itself needs 1.70.
rust-version = "1.78"
description = "Nudge's guide engine: builds prompts and tours from what's on screen, over versioned JSON lines on stdin/stdout."
license = "Apache-2.0"
repository = "https://github.com/Ezra-Black/nudge"
publish = false

[dependencies]
serde = { version = "=1.0.214", features = ["derive"] }
serde_json = "=1.0.132"
